<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description"
    content="Landing pages e sites profissionais para negócios. Desenvolvimento direto com Julia Leticia, do conceito à publicação." />
  <title>Julia Leticia — Landing Pages & Sites para Negócios</title>
  <link rel="icon" type="image/png"
    href="https://raw.githubusercontent.com/juliawlett/julia-assets/main/images/logo-jl.png">
</head>

<body>
  <div id="root">
    <div class="app-loading" role="status" aria-label="Carregando página">
      <span class="app-loading__spinner" aria-hidden="true"></span>
    </div>
  </div>
  <style>
    .app-loading {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ffffff;
    }

    .app-loading__spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e5e7eb;
      border-top-color: #111827;
      border-radius: 50%;
      animation: app-loading-spin 0.8s linear infinite;
    }

    @keyframes app-loading-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
